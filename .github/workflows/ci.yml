name: CI

on:
  push:
    branches:
      - main
      - full-mvp
      - 'step-*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Audit high-severity dependencies
        run: npm run audit

      - name: Check product
        run: npm run check

  package-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Package Linux directory
        run: npx --no-install electron-builder --linux --dir --publish never
