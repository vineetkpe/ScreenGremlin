name: CI

on:
  push:
    branches:
      - main
      - full-mvp
      - 'step-*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Check product
        run: npm run check

  package-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Configure Electron sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Smoke launch hardened desktop shell
        env:
          SCREEN_GREMLIN_SMOKE_TEST: '1'
        run: timeout 20s xvfb-run -a npx --no-install electron .

      - name: Package Linux directory
        run: npx --no-install electron-builder --linux --dir --publish never
